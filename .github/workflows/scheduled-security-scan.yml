name: Scheduled Security Scan

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci || npm install

      - name: NPM audit (high/critical)
        id: npm_audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high > npm-audit.txt

      - name: Trivy filesystem scan (high/critical)
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          output: "trivy.txt"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"

      - name: Gitleaks scan
        id: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build incident report
        if: always()
        run: |
          {
            echo "# Security scan report"
            echo
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Date (UTC): $(date -u +"%Y-%m-%d %H:%M:%S")"
            echo "- npm audit: ${{ steps.npm_audit.outcome }}"
            echo "- trivy: ${{ steps.trivy.outcome }}"
            echo "- gitleaks: ${{ steps.gitleaks.outcome }}"
            echo
            echo "## npm audit output"
            if [ -f npm-audit.txt ]; then
              sed -n '1,200p' npm-audit.txt
            else
              echo "No npm-audit.txt generated."
            fi
            echo
            echo "## trivy output"
            if [ -f trivy.txt ]; then
              sed -n '1,200p' trivy.txt
            else
              echo "No trivy.txt generated."
            fi
          } > security-report.md

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-scan-report
          path: |
            security-report.md
            npm-audit.txt
            trivy.txt
            results.sarif
          if-no-files-found: ignore

      - name: Create or update security incident issue
        if: |
          steps.npm_audit.outcome == 'failure' ||
          steps.trivy.outcome == 'failure' ||
          steps.gitleaks.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_TITLE: Security scan alert
        run: |
          gh label create security \
            --repo "$REPO" \
            --description "Security scan findings" \
            --color d73a4a \
            --force
          gh label create automated \
            --repo "$REPO" \
            --description "Created or updated by automation" \
            --color cfd3d7 \
            --force

          existing_issue="$(
            gh issue list \
              --repo "$REPO" \
              --state open \
              --json number,title \
              --jq '.[] | select(.title == "Security scan alert") | .number' \
            | head -n 1
          )"

          if [ -n "$existing_issue" ]; then
            gh issue edit "$existing_issue" \
              --repo "$REPO" \
              --body-file security-report.md \
              --add-label security \
              --add-label automated
          else
            gh issue create \
              --repo "$REPO" \
              --title "$ISSUE_TITLE" \
              --body-file security-report.md \
              --label security \
              --label automated
          fi

      - name: Close resolved security incident issues
        if: |
          steps.npm_audit.outcome == 'success' &&
          steps.trivy.outcome == 'success' &&
          steps.gitleaks.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh issue list \
            --repo "$REPO" \
            --state open \
            --limit 100 \
            --json number,title \
            --jq '.[] | select(.title == "Security scan alert") | .number' \
          | while read -r issue_number; do
              [ -n "$issue_number" ] || continue
              gh issue close "$issue_number" \
                --repo "$REPO" \
                --comment "Le scan de sécurité est de nouveau vert. Fermeture automatique de cette alerte résolue."
            done
