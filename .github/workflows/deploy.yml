name: Build & Deploy site → O2Switch

on:
  push:
    branches: [main]
  workflow_dispatch: # permet de déclencher manuellement depuis GitHub

concurrency:
  group: deploy-o2switch
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Au niveau du job : le contexte `secrets` n'est pas lisible dans le `if`
    # d'une étape, contrairement à `env`.
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: |
          npm ci || npm install

      - name: Build Astro
        run: npm run build

      - name: Verify kDrive integration
        run: |
          php -l public/media-kdrive.php
          node --test tests/kdrive-storage.test.js tests/kdrive-relay.test.js

      - name: Verify replacement ratings API
        run: |
          tmp_headers="$(mktemp)"
          tmp_body="$(mktemp)"
          trap 'rm -f "$tmp_headers" "$tmp_body"' EXIT

          code="$(curl --fail-with-body --show-error --silent \
            --dump-header "$tmp_headers" \
            --output "$tmp_body" \
            --write-out "%{http_code}" \
            https://admin.stan-bouchet.fr/api/public/ratings)"

          [ "$code" = "200" ]
          tr -d '\r' < "$tmp_headers" | grep -Fqx 'access-control-allow-origin: https://stan-bouchet.eu'
          node -e "const fs=require('fs'); const value=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); if (!Array.isArray(value)) process.exit(1)" "$tmp_body"

      - name: Deploy private gallery → VPS
        if: env.VPS_HOST != ''
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PRIVE_PATH }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./dist/ "$VPS_USER@$VPS_HOST:$VPS_PATH/"
          rm -f ~/.ssh/deploy_key

      - name: Deploy site via FTP → O2Switch
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
