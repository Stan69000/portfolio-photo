name: Build & Deploy site → O2Switch

on:
  push:
    branches: [main]
  workflow_dispatch: # permet de déclencher manuellement depuis GitHub

concurrency:
  group: deploy-o2switch
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci || npm install

      - name: Build Astro
        run: npm run build

      - name: Verify replacement ratings API
        run: |
          tmp_headers="$(mktemp)"
          tmp_body="$(mktemp)"
          trap 'rm -f "$tmp_headers" "$tmp_body"' EXIT

          code="$(curl --fail-with-body --show-error --silent \
            --dump-header "$tmp_headers" \
            --output "$tmp_body" \
            --write-out "%{http_code}" \
            https://admin.stan-bouchet.fr/api/public/ratings)"

          [ "$code" = "200" ]
          grep -Eiq '^access-control-allow-origin: https://stan-bouchet\.eu\r?$' "$tmp_headers"
          node -e "const fs=require('fs'); const value=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); if (!Array.isArray(value)) process.exit(1)" "$tmp_body"

      - name: Deploy site via FTP → O2Switch
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
