about_text: |
  Je suis Stan, photographe amateur. Des rues de Lyon aux chemins de voyage, des scènes de concert aux instants du quotidien, je photographie ce qui me touche.

  Cette galerie rassemble ces fragments, au fil de mes découvertes. Prenez le temps de vous y promener.
