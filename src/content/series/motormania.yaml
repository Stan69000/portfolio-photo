description: >-
  Red Bull Motormania 2025 était la première édition française de ce festival de sports mécaniques, organisée le samedi
  13 septembre 2025 au circuit de Nevers Magny-Cours. Elle a réuni F1, MotoGP, drift, stunt, freestyle motocross et
  voltige aérienne dans une journée de démonstrations et de duels.
